<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1f4d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/app-icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./assets/app-icon-192.png">
<title>TUSHAR VISA SIM Management System</title>
<style>
  :root{
    --bg:#f3f5f9; --card:#fff; --text:#1c2333; --muted:#6b7488; --line:#e3e7ef;
    --primary:#2563eb; --primary-d:#1d4ed8; --green:#16a34a; --red:#dc2626; --amber:#d97706;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Roboto,Arial,"Noto Sans Bengali","Kalpurush","SolaimanLipi",sans-serif;background:var(--bg);color:var(--text);font-size:15px}
  header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:18px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  header h1{margin:0;font-size:20px}
  header small{opacity:.85}
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .stat{background:rgba(255,255,255,.15);padding:6px 14px;border-radius:10px;text-align:center;min-width:80px}
  .stat b{display:block;font-size:20px}
  .stat span{font-size:12px;opacity:.9}
  main{max-width:1200px;margin:0 auto;padding:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card h2{margin:0 0 12px;font-size:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1 1 160px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--text)}
  input:focus,select:focus,textarea:focus{outline:2px solid #bfd3ff;border-color:var(--primary)}
  button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:9px 16px;background:var(--primary);color:#fff;font-weight:600}
  button:hover{background:var(--primary-d)}
  button.sec{background:#eef1f7;color:var(--text)}
  button.sec:hover{background:#e0e5ef}
  button.danger{background:#fee2e2;color:var(--red);padding:6px 10px}
  button.danger:hover{background:#fecaca}
  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
  .actions>*{flex:0 0 auto}
  .search-wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  .search-wrap .grow{flex:1 1 280px}
  #q{font-size:20px;letter-spacing:1px;padding:12px 14px;border:2px solid var(--primary)}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:760px}
  th{background:#f0f3f9;text-align:left;font-size:12px;color:var(--muted);padding:9px 8px;position:sticky;top:0}
  td{padding:6px 6px;border-top:1px solid var(--line);vertical-align:middle}
  td input,td select{padding:6px 8px;border-color:transparent;background:#f8f9fc}
  td input:hover,td select:hover{border-color:var(--line)}
  .num{font-weight:700;font-size:16px;font-family:Consolas,monospace;white-space:nowrap}
  mark{background:#fde68a;border-radius:3px;padding:0 1px}
  .pid{font-weight:800;font-size:18px;font-family:Consolas,monospace;white-space:nowrap}
  .pid.S{color:#334155}
  .idb .big.S{color:#334155}
  .pid.T{color:#15803d}.pid.M{color:#b91c1c}.pid.O{color:#4338ca}
  .nopid{color:#b0b6c3;font-weight:400}
  .idb{display:flex;align-items:center;gap:16px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:10px 16px;margin-top:10px}
  .idb .big{font-size:38px;font-weight:800;font-family:Consolas,monospace;min-width:100px;text-align:center}
  .idb .big.T{color:#15803d}.idb .big.M{color:#b91c1c}.idb .big.O{color:#4338ca}
  .idb .big.none{font-size:15px;color:#92400e;font-weight:600}
  .idb .info{line-height:1.5}
  .idb .info b{font-size:17px;font-family:Consolas,monospace}
  .badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
  .p-tourist{background:#dcfce7;color:#166534}
  .p-medical{background:#fee2e2;color:#991b1b}
  .p-other{background:#e0e7ff;color:#3730a3}
  .empty{padding:30px;text-align:center;color:var(--muted)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.3s;z-index:9}
  .toast.show{opacity:1}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  details summary{cursor:pointer;font-weight:600}
  .warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:8px 12px;font-size:13px;margin-top:10px}
  @media(max-width:600px){main{padding:10px}}

  /* ---- polish + edit UI ---- */
  tbody tr:hover{background:#f7f9fd}
  td{padding:10px 8px}
  td.idx{color:var(--muted);font-size:13px}
  .notecell{color:var(--muted);font-size:13px;max-width:220px}
  .acts{white-space:nowrap;text-align:right}
  button.icon{padding:7px 10px;background:#eef1f7;color:var(--text);font-size:15px;line-height:1;border-radius:8px;margin-left:4px}
  button.icon:hover{background:#dbe7ff}
  button.icon.del{background:#fee2e2}
  button.icon.del:hover{background:#fecaca}
  .badge{font-size:12px;padding:3px 10px}
  .p-unknown{background:#f1f5f9;color:#475569}
  .keep{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:10px;cursor:pointer}
  .keep input{width:auto}
  .pcol[data-p=tourist]{border-color:#86efac;background:#f0fdf4}
  .pcol[data-p=medical]{border-color:#fca5a5;background:#fef2f2}
  .pcol[data-p=other]{border-color:#a5b4fc;background:#eef2ff}
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
  .overlay[hidden]{display:none}
  .modal{background:#fff;border-radius:18px;width:100%;max-width:520px;max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .18s ease}
  @keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
  .mhead{display:flex;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#eff6ff,#fff)}
  .mhead h3{margin:0;font-size:17px}
  .mids{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
  button.x{background:#eef1f7;color:var(--muted);padding:0;width:32px;height:32px;border-radius:50%;flex:0 0 auto}
  button.x:hover{background:#e0e5ef}
  .mbody{padding:16px 20px;display:grid;gap:12px}
  .mbody .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #eNum{font-family:Consolas,monospace;font-size:18px;font-weight:700;letter-spacing:1px}
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .opt{position:relative;margin:0;font-size:13px;color:var(--text);cursor:pointer}
  .opt input{position:absolute;opacity:0;width:0;height:0;padding:0}
  .opt span{display:block;text-align:center;padding:10px 4px;border:2px solid var(--line);border-radius:10px;font-weight:600;background:#fff}
  .opt input:focus-visible+span{outline:2px solid #bfd3ff}
  .opt.u input:checked+span{border-color:#64748b;background:#f1f5f9}
  .opt.t input:checked+span{border-color:#16a34a;background:#dcfce7;color:#166534}
  .opt.m input:checked+span{border-color:#dc2626;background:#fee2e2;color:#991b1b}
  .opt.o input:checked+span{border-color:#4f46e5;background:#e0e7ff;color:#3730a3}
  .ewarn,.eerr{font-size:13px;border-radius:10px;padding:8px 12px;background:#fffbeb;border:1px solid #fde68a;color:#92400e}
  .eerr{background:#fef2f2;border-color:#fecaca;color:#991b1b}
  .ewarn:empty,.eerr:empty{display:none}
  .mfoot{display:flex;gap:8px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);background:#fafbfd}
  .mfoot .sp{flex:1}
  @media(max-width:520px){.seg{grid-template-columns:1fr 1fr}.mbody .two{grid-template-columns:1fr}}
  button.icon{display:inline-flex;align-items:center}
  button.icon.del{color:var(--red)}

  /* ---- category groups + search scope ---- */
  .scope{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chip{background:#eef1f7;color:var(--text);padding:8px 14px;border-radius:999px;border:2px solid transparent;font-weight:600;font-size:14px}
  .chip:hover{background:#e0e5ef}
  .chip b{margin-left:6px;font-size:12px;background:#fff;border-radius:999px;padding:1px 8px;color:var(--muted)}
  .chip.on{background:#1e3a8a;color:#fff}
  .chip.on b{color:#1e3a8a}
  .chip.on.medical{background:#dc2626}.chip.on.medical b{color:#dc2626}
  .chip.on.tourist{background:#16a34a}.chip.on.tourist b{color:#16a34a}
  .chip.on.other{background:#4f46e5}.chip.on.other b{color:#4f46e5}
  .chip.on.none{background:#64748b}.chip.on.none b{color:#64748b}
  tr.grp td{padding:10px 12px;font-weight:700;font-size:14px;cursor:pointer;user-select:none;border-top:2px solid var(--line)}
  tr.grp:hover{background:inherit}
  tr.grp.medical td{background:#fee2e2;color:#991b1b}
  tr.grp.tourist td{background:#dcfce7;color:#166534}
  tr.grp.other td{background:#e0e7ff;color:#3730a3}
  tr.grp.unknown td{background:#f1f5f9;color:#475569}
  tr.grp .gc{margin-left:8px;font-size:12px;background:#fff;border-radius:999px;padding:1px 9px}
  tr.grp .car{display:inline-block;width:14px}
  /* similar-number (typo tolerant) panel */
  .simp{margin-top:12px;border:2px solid #f59e0b;background:#fffbeb;border-radius:12px;padding:10px 14px}
  .simp-h{font-weight:800;color:#92400e;font-size:15px}
  .simp-h span{background:#f59e0b;color:#fff;border-radius:999px;padding:1px 9px;font-size:12px;margin-left:6px}
  .simp-sub{font-size:12px;color:#92400e;margin:2px 0 8px}
  .simrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid #fde68a;border-radius:10px;padding:8px 12px;margin-top:6px}
  .simrow .num{font-size:20px;letter-spacing:1px}
  .simrow .who{color:var(--muted);font-size:13px;flex:1 1 140px}
  .dx{background:#fecaca;color:#991b1b;border-radius:3px;padding:0 1px}
  .dt{background:#fed7aa;color:#9a3412;border-radius:3px;padding:0 1px}
  .mpct{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:#fef3c7;color:#92400e;white-space:nowrap}
  .mpct.hi{background:#fde68a}
  /* given (handed-over) status */
  .p-given{background:#d1fae5;color:#065f46}
  tr.given td:not(.acts){opacity:.55}
  button.icon.give{color:#9ca3af}
  button.icon.give.on{background:#d1fae5;color:#065f46}
  .printonly{display:none}
  @media print{
    header,main>.card:not(#listCard),.toast,.overlay,.acts,thead th:last-child{display:none!important}
    body{background:#fff}
    .card{border:0;box-shadow:none;padding:0}
    .printonly{display:block;font-weight:700;margin:0 0 8px}
    table{min-width:0;font-size:12px} tr{break-inside:avoid}
    tr.grp td,.badge{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    tr.given td{opacity:1}
  }

  /* ---- wanted list + match alerts + extras ---- */
  .stat.click{cursor:pointer}
  .stat.click:hover{background:rgba(255,255,255,.28)}
  .p-want{background:#e0f2fe;color:#075985}
  .wantp{margin-top:12px;border:2px solid #38bdf8;background:#f0f9ff;border-radius:12px;padding:10px 14px}
  .wantp-h{font-weight:800;color:#075985;font-size:15px}
  .wantp-h span{background:#0ea5e9;color:#fff;border-radius:999px;padding:1px 9px;font-size:12px;margin-left:6px}
  .wrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px}
  .wantp .wrow{border-color:#bae6fd}
  .wrow.found{background:#f0fdf4;border-color:#bbf7d0}
  .wrow.closed{opacity:.6}
  .wmain{flex:1 1 320px;min-width:0}
  .wmain .num{font-size:19px;letter-spacing:1px}
  .wmeta{font-size:13px;color:var(--muted);margin-top:3px}
  .wmeta b{color:var(--text)}
  .wbtn{display:flex;gap:6px;flex-wrap:wrap}
  .wbtn button,.wlive button,.mcard button{padding:6px 12px;font-size:13px}
  button.good{background:#16a34a}button.good:hover{background:#15803d}
  button.ghost{background:#eef1f7;color:var(--text)}button.ghost:hover{background:#e0e5ef}
  .wlive{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;padding:8px 10px;background:#fffbeb;border:1px dashed #f59e0b;border-radius:10px;font-size:13px}
  .wlive .num{font-size:16px}
  .wfound{margin-top:6px;font-size:13px;color:#166534}
  .mk{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
  .mk-exact{background:#bbf7d0;color:#166534}.mk-partial{background:#bae6fd;color:#075985}.mk-similar{background:#fde68a;color:#92400e}
  .mcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
  .mcard.exact{border-color:#86efac;background:#f0fdf4}.mcard.partial{border-color:#7dd3fc;background:#f0f9ff}.mcard.similar{border-color:#fcd34d;background:#fffbeb}
  .mcard .num{font-size:19px;letter-spacing:1px}
  .mcard .done{font-weight:700;color:#166534;font-size:13px}.mcard .done.no{color:#6b7280}
  #infoOv .modal{max-width:660px}
  .wantnote{font-size:13px;border-radius:10px;padding:8px 12px;background:#f0f9ff;border:1px solid #7dd3fc;color:#075985;margin-top:8px}
  .undo{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 10px 8px 18px;border-radius:12px;z-index:30;display:flex;gap:14px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
  .undo[hidden]{display:none}
  .undo button{background:#fbbf24;color:#111827;padding:6px 14px}

  /* ---- home button + note dialog ---- */
  .homebtn{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);padding:8px 14px}
  .homebtn:hover{background:rgba(255,255,255,.3)}
  .hrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  #noteOv{z-index:40}
  #noteOv .modal{max-width:460px;text-align:center}
  .nhead{padding:24px 24px 6px}
  .nhead h3{margin:12px 0 4px;font-size:20px}
  .nhead p{margin:0;color:var(--muted);font-size:14px}
  .ncheck{width:56px;height:56px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#fff;background:#16a34a;box-shadow:0 0 0 8px #dcfce7;animation:pop .25s ease}
  .nhead.warn .ncheck{background:#f59e0b;box-shadow:0 0 0 8px #fef3c7}
  .nbody{padding:14px 24px 22px;display:grid;gap:12px;text-align:left}
  .nids{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .nid{border:2px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;background:#f8fafc}
  .nid span{display:block;font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:700}
  .nid b{display:block;font-size:40px;line-height:1.15;font-family:Consolas,monospace}
  .nid.S b{color:#334155}.nid.T{border-color:#86efac;background:#f0fdf4}.nid.T b{color:#15803d}
  .nid.M{border-color:#fca5a5;background:#fef2f2}.nid.M b{color:#b91c1c}
  .nid.O{border-color:#a5b4fc;background:#eef2ff}.nid.O b{color:#4338ca}
  .nid.none b{font-size:22px;color:#94a3b8;padding:10px 0}
  .ndetail{text-align:center;font-size:14px;color:var(--text);line-height:1.6}
  .ndetail .num{font-size:20px;letter-spacing:1px}
  .nwarn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5}
  .nack{display:flex;align-items:center;gap:12px;border:2px solid var(--primary);border-radius:12px;padding:12px 14px;cursor:pointer;font-weight:700;font-size:15px;color:var(--text);margin:0;background:#eff6ff}
  .nack input{width:22px;height:22px;flex:0 0 auto;accent-color:#16a34a}
  .bigok{width:100%;padding:18px 20px;font-size:19px;font-weight:800;letter-spacing:.3px;color:#fff;border-radius:14px;border:0;
    background:linear-gradient(180deg,#22c55e,#16a34a);box-shadow:0 6px 16px rgba(22,163,74,.35),inset 0 1px 0 rgba(255,255,255,.3);
    display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:transform .12s,box-shadow .12s,filter .12s}
  .bigok:hover{background:linear-gradient(180deg,#22c55e,#15803d);filter:brightness(1.03);transform:translateY(-1px);box-shadow:0 9px 20px rgba(22,163,74,.4),inset 0 1px 0 rgba(255,255,255,.3)}
  .bigok:active{transform:translateY(1px) scale(.99);box-shadow:0 2px 6px rgba(22,163,74,.35)}
  .bigok:focus-visible{outline:4px solid #bbf7d0;outline-offset:2px}
  .bigok .tick{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.25);font-size:19px}
  .bigok.done{background:#15803d;pointer-events:none;animation:okpop .35s ease}
  @keyframes okpop{0%{transform:scale(1)}45%{transform:scale(1.04)}100%{transform:scale(1)}}
  .nserial{background:linear-gradient(180deg,#f8fafc,#eef2f7);border:1px solid var(--line);border-radius:20px;padding:18px 10px 16px;text-align:center}
  .nserial small{display:block;font-size:12px;letter-spacing:3px;color:var(--muted);font-weight:700}
  .nserial b{display:block;font-size:clamp(64px,20vw,104px);line-height:1.05;font-weight:800;font-family:Consolas,"Segoe UI",monospace;color:#0f172a;letter-spacing:2px}
  .nserial .snum{display:block;margin-top:4px;font-size:14px;color:var(--muted);letter-spacing:1px}
  .nmsg{text-align:center;font-size:15px;color:#334155;line-height:1.5;padding:0 6px}
  .nmini{text-align:center;font-size:12.5px;color:#92400e;background:#fffbeb;border-radius:10px;padding:6px 10px}
  .nhint{text-align:center;font-size:12px;color:var(--muted);margin-top:-4px}
  .nlist{max-height:38vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .nlist table{min-width:0;font-size:14px}
  .nlist td,.nlist th{padding:6px 10px}
  .nsub{font-weight:700;font-size:13px;margin:4px 0 -4px;color:#92400e}
  .nbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .dupcard{border:2px solid #fcd34d;background:#fffbeb;border-radius:14px;padding:12px 14px;display:grid;gap:6px}
  .dupcard .ids{display:flex;gap:16px;align-items:baseline}
  .dupcard .ids b{font-size:32px;font-family:Consolas,monospace}
  .dupcard .num{font-size:20px;letter-spacing:1px}

/* ================= UI + MOTION LAYER (visual only; no data logic) ================= */
:root{--bg:#eef1f8;--line:#e0e6f1;--primary:#2f5bea;--primary-d:#2347c8;--ease:cubic-bezier(.22,1,.36,1);
  --sh1:0 1px 2px rgba(16,30,70,.05),0 4px 14px rgba(16,30,70,.06);--sh2:0 2px 4px rgba(16,30,70,.06),0 14px 34px rgba(16,30,70,.14);--safe:env(safe-area-inset-bottom,0px)}
.bnav{display:none}
@media screen{
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;background:radial-gradient(1100px 380px at 50% -120px,#dbe4ff,transparent 70%),var(--bg)}
header{background:linear-gradient(135deg,#0f1f4d 0%,#1d3fae 60%,#2f5bea 100%);padding:20px 24px;box-shadow:0 10px 28px rgba(15,31,77,.28);position:relative;overflow:hidden}
header::after{content:"";position:absolute;width:340px;height:340px;right:-90px;top:-170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%);pointer-events:none}
header>*{position:relative;z-index:1}
header h1{font-size:21px;letter-spacing:.2px}

        <div><label>Customer name</label><input id="wName"></div>

      <div style="flex:0 0 170px"><select id="wFilter"><option value="open">Still looking</option><option value="found">Found</option><option value="closed">Closed</option><option value="all">All</option></select></div>
      <button type="button" class="sec" id="wScan">🔄 Check my whole list now</button>

<script>
(function(){
  let KEY = 'simManagerData_v1';
  let META = 'simManagerMeta_v1';
  let sims = [];
  let wanted = [];
  let WKEY = 'simManagerWanted_v1';
  let meta = {lastBackup:null, counters:{T:0,M:0,O:0}};
  let fileHandle = null;

  const $ = id => document.getElementById(id);
  const PL = {tourist:'Tourist', medical:'Medical', other:'Other', '':''};
  const PREFIX = {tourist:'T', medical:'M', other:'O'};

  // ---------- আইডি ----------
  // আইডি একবার দিলে কখনো আবার অন্য সিমকে দেওয়া হয় না (মুছে ফেললেও), তাই ডুপ্লিকেট হওয়ার সুযোগ নেই
  function pidTaken(p, except){ return sims.some(x => x !== except && x.pid === p); }
  function assignPid(s){
    const pre = PREFIX[s.purpose];
    if(!pre){ s.pid = ''; return; }
    let n = meta.counters[pre] || 0, p;
    do { n++; p = pre + n; } while(pidTaken(p, s));
    meta.counters[pre] = n; s.pid = p; saveMeta();
  }
  // স্থায়ী নম্বর (S1, S2...): সিম যোগ হওয়ার সাথে সাথে বসে, কখনো বদলায় না
  function assignSid(s){
    let n = meta.counters.S || 0, p;
    do { n++; p = 'S' + n; } while(sims.some(x => x !== s && x.sid === p));
    meta.counters.S = n; s.sid = p; saveMeta();
  }
  function ensureIds(){
    meta.counters = Object.assign({T:0,M:0,O:0,S:0}, meta.counters || {});
    sims.forEach(s=>{
      const m = /^([TMO])(\d+)$/.exec(s.pid || '');
      if(m) meta.counters[m[1]] = Math.max(meta.counters[m[1]], +m[2]);
      const m2 = /^S(\d+)$/.exec(s.sid || '');
      if(m2) meta.counters.S = Math.max(meta.counters.S, +m2[1]);
    });
    let changed = false;
    for(let i=sims.length-1; i>=0; i--){           // পুরোনো এন্ট্রি আগে, তাই নম্বর ক্রমানুসারে হয়
      const s = sims[i];
      if(!s.sid){ assignSid(s); changed = true; }
      if(!s.pid && PREFIX[s.purpose]){ assignPid(s); changed = true; }
    }
    saveMeta();
    if(changed){ try{ localStorage.setItem(KEY, JSON.stringify(sims)); }catch(e){} }
  }

  // ---------- helpers ----------
  const bn2en = s => String(s||'').replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d));
  const digits = s => bn2en(s).replace(/\D/g,'');
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  function toast(msg,ms){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms||2200)}
  function fmtDate(iso){ if(!iso) return 'Never'; return new Date(iso).toLocaleString('en-GB'); }

  // ---------- storage ----------
  function load(){
    try{ sims = JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ sims=[]; }
    try{ meta = Object.assign(meta, JSON.parse(localStorage.getItem(META)||'{}')); }catch(e){}
    ensureIds();
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(sims)); }
    catch(e){ toast('Could not save! Download a backup.'); }
    writeAuto();
    renderWanted();
    if(window.simCloudLocalChanged) window.simCloudLocalChanged('sims');
  }
  function saveMeta(){ try{localStorage.setItem(META, JSON.stringify(meta));}catch(e){} if(window.simCloudLocalChanged) window.simCloudLocalChanged('meta'); }

  async function writeAuto(){
    if(!fileHandle) return;
    try{
      const w = await fileHandle.createWritable();
      await w.write(JSON.stringify(payload(), null, 2));
      await w.close();
      meta.lastBackup = new Date().toISOString(); saveMeta(); showBackupInfo();
    }catch(e){ fileHandle=null; $('autoBtn').textContent='Auto-backup'; }
  }
  const payload = () => ({app:'sim-manager', version:1, exportedAt:new Date().toISOString(), counters:meta.counters, sims, wanted});

  function showBackupInfo(){
    $('backupInfo').textContent = 'Last backup: ' + fmtDate(meta.lastBackup) + (fileHandle ? ' • Auto-backup on' : '');
  }

  function download(name, text, type){
    const blob = new Blob([text], {type});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 500);
  }
  const stamp = () => { const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; };

  // ---------- add ----------
  const pendingNumbers = new Set();
  async function addSim(number, name, home, purpose){
    const n = digits(number);
    if(!n) return {ok:false, msg:'Enter a valid number'};
    const dup = sims.find(s => s.number === n);
    if(dup) return {ok:false, dup:true, msg:'This number already exists'};
    if(pendingNumbers.has(n)) return {ok:false, msg:'This number is already being added. Please wait.'};
    pendingNumbers.add(n);
    const obj = {id:uid(), sid:'', pid:'', number:n, name:(name||'').trim(), home:(home||'').trim(), purpose:purpose||'', note:'', createdAt:new Date().toISOString()};
    try{
      if(window.simCloudAllocateIds){
        const ids = await window.simCloudAllocateIds(obj.purpose);
        obj.sid = ids.sid; obj.pid = ids.pid;
        meta.counters = Object.assign(meta.counters||{}, ids.counters||{});
        saveMeta();
      } else { assignSid(obj); assignPid(obj); }
      sims.unshift(obj);
      return {ok:true, pid:obj.pid, sid:obj.sid};
    }catch(err){ return {ok:false, msg:'Could not reserve a unique ID from Firebase. Check your connection and try again.'}; }
    finally{ pendingNumbers.delete(n); }
  }

  $('addForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const r = await addSim($('fNum').value, $('fName').value, $('fHome').value, $('fPurpose').value);
    if(!r.ok){
      if(r.dup){ const ex = sims.find(x=>x.number===digits($('fNum').value)); resetView(false); $('q').value = ex.number; render(); showDup(ex); }
      else toast(''+r.msg);
      return;
    }
    save();
    closeAddPanel();
    // নাম/বাড়ি/ধরন ধরে রাখি না — শুধু নাম্বার ঘর ফাঁকা করে আবার সেখানেই ফোকাস
    $('fNum').value=''; $('fName').value=''; $('fHome').value='';
    if(!$('keepP').checked){ $('fPurpose').value=''; $('fPurpose').dataset.p=''; }
    $('fNum').focus();
    const nobj = sims[0];
    const near = similarAll(nobj.number, new Set([nobj]));   // হাতে লেখার ভুল ধরতে: প্রায়-একই নাম্বার আগে থেকে আছে কি?
    $('q').value = near.length ? nobj.number : ''; render();
    if(askNoteOn()) showAddedNote(nobj, near);
    else toast('Added — ' + r.sid + (r.pid ? ' • ' + r.pid : ' • Unknown') + (near.length ? ` • ⚠ ${near.length} similar number(s) already exist — see top of page` : ''), near.length ? 6000 : 2200);
    updateAddHint();
    handleHits(scanWanted([nobj]), 'new');   // কেউ এই সিম খুঁজছিল কি?
  });

  $('bulkBtn').addEventListener('click', async ()=>{
    const parts = bn2en($('bulk').value).split(/[\s,;]+/).map(digits).filter(Boolean);
    if(!parts.length){ toast('No numbers found'); return; }
    let added=0, dup=0; const addedList=[], dupList=[];
    const bp = $('bulkPurpose').value;
    for(const p of parts){ const r=await addSim(p,'','',bp); if(r.ok){ added++; addedList.push(sims[0]); } else { if(r.dup){ dup++; dupList.push(sims.find(x=>x.number===p)); } else { toast(r.msg||'Could not add SIM'); return; } } }
    save(); $('bulk').value=''; render();
    if(askNoteOn()) showBulkNote(addedList, dupList); else toast(`${added} added` + (dup?`, ${dup} already existed`:''));
    if(added) handleHits(scanWanted(sims.slice(0, added)), 'new');
  });

  // ---------- render ----------
  function statusOK(s){ const v=$('filterS').value; if(v==='incomplete') return !s.name || !s.purpose; return v==='all' || (v==='given' ? !!s.given : !s.given); }
  const BD_PREFIXES = {
    '013':'Grameenphone', '017':'Grameenphone',
    '014':'Banglalink', '019':'Banglalink',
    '015':'Teletalk', '016':'Airtel / Robi', '018':'Robi'
  };
  function prefixSearch(qd){
    return qd.length >= 3 && Object.keys(BD_PREFIXES).some(prefix => qd.startsWith(prefix));
  }
  function matches(s, q, mode, fp){
    if(!statusOK(s)) return false;
    if(fp==='none' ? s.purpose!=='' : (fp!=='all' && s.purpose!==fp)) return false;
    if(!q) return true;
    const idq = q.trim().toUpperCase();
    if(/^[TMOS]\d+$/.test(idq)) return s.pid === idq || s.sid === idq;
    const qd = digits(q);
    const isNum = /^[\d০-৯\s\-+]+$/.test(q) && qd.length>0;
    if(isNum){
      if(qd.length === 11) return s.number === qd;
      if(qd.length > 11) return false;
      if(prefixSearch(qd)) return s.number.startsWith(qd);
      return s.number.endsWith(qd);
    }
    const t = q.trim().toLowerCase();
    return (s.name||'').toLowerCase().includes(t) || (s.home||'').toLowerCase().includes(t) || (s.note||'').toLowerCase().includes(t) || (PL[s.purpose]||'').toLowerCase().includes(t);
  }

  function numHtml(number, q, mode){
    const qd = digits(q);
    const isNum = q && /^[\d০-৯\s\-+]+$/.test(q) && qd;
    if(!isNum) return esc(number);
    if(qd.length===11 && number===qd) return '<mark>'+esc(number)+'</mark>';
    if(prefixSearch(qd) && number.startsWith(qd)) return '<mark>'+esc(qd)+'</mark>'+esc(number.slice(qd.length));
    if(number.endsWith(qd)) return esc(number.slice(0,-qd.length))+'<mark>'+esc(qd)+'</mark>';
    return esc(number);
  }

  // ---------- প্রায়-মিল (হাতে লেখার ভুল ধরার জন্য) ----------
  // a = যা লিখেছেন, b = সংরক্ষিত নাম্বার। ভুল ডিজিট, বাদ পড়া/বাড়তি ডিজিট, পাশাপাশি দুই ডিজিট উল্টে যাওয়া — সব ধরে।
  function editInfo(a, b){
    const m=a.length, n=b.length;
    const d = Array.from({length:m+1}, ()=>new Array(n+1).fill(0));
    for(let i=0;i<=m;i++) d[i][0]=i;
    for(let j=0;j<=n;j++) d[0][j]=j;
    for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
      let v = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1]===b[j-1]?0:1));
      if(i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1]) v = Math.min(v, d[i-2][j-2]+1);
      d[i][j] = v;
    }
    const mark = new Array(n).fill('x'); let i=m, j=n, hit=0;
    while(i>0 || j>0){
      if(i>1 && j>1 && a[i-1]!==b[j-1] && a[i-1]===b[j-2] && a[i-2]===b[j-1] && d[i][j]===d[i-2][j-2]+1){ mark[j-1]='t'; mark[j-2]='t'; i-=2; j-=2; }
      else if(i>0 && j>0 && d[i][j]===d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){ if(a[i-1]===b[j-1]){ mark[j-1]='m'; hit++; } i--; j--; }
      else if(i>0 && d[i][j]===d[i-1][j]+1){ i--; }
      else { j--; }
    }
    return {d:d[m][n], mark, hit};
  }
  function inScope(s, fp){ if(!statusOK(s)) return false; return fp==='none' ? s.purpose==='' : (fp==='all' || s.purpose===fp); }
  // পুরো নাম্বার (৭+ ডিজিট) লিখলে হুবহু মিল না হলেও কাছাকাছি নাম্বারগুলো খুঁজে দেয়
  function similarAll(q, exact){
    const qd = digits(q);
    if(!/^[\d০-৯\s\-+]+$/.test(q) || qd.length < 7) return [];
    const maxD = qd.length>=10 ? 3 : qd.length>=8 ? 2 : 1;   // ১১ ডিজিটে সর্বোচ্চ ৩টা ভুল পর্যন্ত
    const out = [];
    sims.forEach(s=>{
      if(exact.has(s) || Math.abs(s.number.length-qd.length) > maxD) return;
      const r = editInfo(qd, s.number);
      if(r.d <= maxD) out.push({s, d:r.d, mark:r.mark, hit:r.hit, len:Math.max(qd.length, s.number.length)});
    });
    out.sort((x,y)=> x.d-y.d || y.hit-x.hit);
    return out;
  }
  function markedNumber(number, mark){
    return [...number].map((c,i)=> mark[i]==='x' ? `<span class="dx">${c}</span>` : mark[i]==='t' ? `<span class="dt">${c}</span>` : c).join('');
  }

  const ICON_EDIT = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';
  const ICON_DEL = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>';
  const GROUPS = [['medical','Medical'],['tourist','Tourist'],['other','Other'],['','Unknown']];
  const SCOPES = [['all','All'],['medical','Medical'],['tourist','Tourist'],['other','Other'],['none','Unknown']];
  const collapsed = {};
  let listPanelOpen = false;
  const idNum = s => { const m=/(\d+)$/.exec(s.pid||s.sid||''); return m ? +m[1] : 1e9; };
  function render(){
    const q = $('q').value, mode='end', fp=$('filterP').value;
    const qd = digits(q);
    $('listCard').classList.toggle('is-visible', !!q.trim() || listPanelOpen);
    const hint = $('searchHint');
    if(!q.trim()) hint.textContent = 'Type last digits, or search a series: 013 · 014 · 015 · 016 · 017 · 018 · 019';
    else if(/^[\d০-৯\s\-+]+$/.test(q) && qd.length===11) hint.textContent = '11 digits · exact full-number match';
    else if(/^[\d০-৯\s\-+]+$/.test(q) && prefixSearch(qd)) hint.textContent = `${BD_PREFIXES[qd.slice(0,3)] || 'Mobile'} series · begins with ${qd}`;

  // ---------- খোঁজার তালিকা (Wanted) ----------
  function loadWanted(){

  const KIND_LABEL = {exact:'Exact match', partial:'Same last digits', similar:'Similar — possible typo'};
  const KIND_RANK = {exact:0, partial:1, similar:2};
  const maxDfor = len => len>=10 ? 3 : len>=8 ? 2 : 1;
  const histDiff = (a,b) => { const h=new Array(10).fill(0); for(const c of a) h[+c]++; for(const c of b) h[+c]--; return h.reduce((t,v)=>t+Math.abs(v),0); };

  // w (খোঁজা নাম্বার) বনাম s (সিম): হুবহু / শেষের ডিজিট মেলে / হাতের ভুল সহ প্রায়-মিল
  function wantMatch(w, s){
    const wd = w.number, sn = s.number;
    if(!wd || !sn) return null;
    const plain = new Array(sn.length).fill('m');
    if(wd === sn) return {kind:'exact', d:0, hit:sn.length, len:sn.length, mark:plain};
    if(wd.length < sn.length && wd.length >= 4 && (sn.endsWith(wd) || (wd.length>=6 && sn.includes(wd))))
      return {kind:'partial', d:0, hit:wd.length, len:sn.length, mark:plain};
    if(wd.length >= 7){
      const md = maxDfor(wd.length);
      if(Math.abs(wd.length - sn.length) <= md && histDiff(wd, sn) <= 2*md){
        const r = editInfo(wd, sn);
        if(r.d <= md) return {kind:'similar', d:r.d, hit:r.hit, len:Math.max(wd.length, sn.length), mark:r.mark};
      }
    }
    return null;
  }
  const isIgnored = (w, s) => (w.ignored||[]).includes(s.number);
  function scanWanted(list){
    const hits = [];
    wanted.forEach(w=>{
      if(w.status !== 'open') return;
      list.forEach(s=>{ if(isIgnored(w,s)) return; const m = wantMatch(w,s); if(m) hits.push({w, s, m}); });
    });
    hits.sort((a,b)=> KIND_RANK[a.m.kind]-KIND_RANK[b.m.kind] || a.m.d-b.m.d);
    return hits;
  }
  const simOfWanted = w => sims.find(s=>s.id===w.matchSimId) || sims.find(s=>s.number===w.matchNumber);

  function markFound(w, s, m){
    w.status = 'found'; w.matchSimId = s.id; w.matchNumber = s.number; w.matchSid = s.sid; w.matchPid = s.pid;
    w.matchKind = m ? m.kind : 'manual'; w.foundAt = new Date().toISOString();
    let filled = false;
    if(!s.name && w.name){ s.name = w.name; filled = true; }                     // সিমে কাস্টমারের নাম বসিয়ে দিই
    if(!s.note && w.number !== s.number){ s.note = 'Wanted: ' + w.number; filled = true; }
    return filled;
  }

  // নতুন সিম এলে যা মিলল তা নিয়ে কাজ: হুবহু মিললে নিজে থেকে "Found", বাকিগুলো জিজ্ঞেস করে
  function handleHits(hits, ctx){
    if(!hits.length) return;
    const done = new Set(), out = []; let simChanged = false;
    hits.forEach(h=>{ if(h.m.kind==='exact' && !done.has(h.w.id)){ if(markFound(h.w, h.s, h.m)) simChanged = true; done.add(h.w.id); out.push({...h, ctx, state:'auto'}); } });
    hits.forEach(h=>{ if(h.m.kind!=='exact' && !done.has(h.w.id)) out.push({...h, ctx, state:'pending'}); });
    if(!out.length) return;
    saveWanted(); if(simChanged) save(); render(); renderWanted();
    queueMatches(out);
  }

  function drawMatches(){
    const n = matchState.length;

      if(h.state==='auto') foot = `<div class="done">✔ Marked as Found automatically${(w.name && s.name===w.name)?' • customer name saved on the SIM':''}</div>`;
      else if(h.state==='yes') foot = `<div class="done">✔ Confirmed — marked as Found</div>`;
      else if(h.state==='no') foot = `<div class="done no">✖ Not the same SIM — won't alert again</div>`;
      else foot = `<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="good" data-macts="yes" data-i="${i}">✔ Yes, this is it</button><button type="button" class="ghost" data-macts="no" data-i="${i}">✖ Not it</button></div>`;

        ${foot}
      </div>`;

  // Wanted তালিকা দেখানো
  function wantedForQuery(q, mode){
    const qd = digits(q), t = q.trim().toLowerCase();
    const isNum = /^[\d০-৯\s\-+]+$/.test(q) && qd.length>0;
    const isId = /^[TMOS]\d+$/i.test(t);
    return wanted.filter(w=>{
      if(isId){ const u = t.toUpperCase(); return w.matchSid===u || w.matchPid===u; }
      if(isNum){
        if(qd.length===11 && w.number===qd) return true;
        if(qd.length>11) return false;
        if(prefixSearch(qd) && w.number.startsWith(qd)) return true;
        if(qd.length>=2 && w.number.endsWith(qd)) return true;
        if(qd.length>=7 && qd.length<11 && w.number.length>=7){ const md = maxDfor(qd.length); return Math.abs(qd.length-w.number.length)<=md && histDiff(qd,w.number)<=2*md && editInfo(qd,w.number).d<=md; }
        return false;
      }
      return (w.name||'').toLowerCase().includes(t) || (w.note||'').toLowerCase().includes(t) || (w.phone||'').includes(t);
    });
  }
  function renderWanted(){
    if(!$('wantList')) return;

      .sort((a,b)=> (a.status==='open'?0:1)-(b.status==='open'?0:1) || (b.createdAt||'').localeCompare(a.createdAt||''));

      if(w.status==='open'){
        const hits = scanWanted(sims).filter(h=>h.w===w).slice(0,3);
        live = hits.map(h=>`<div class="wlive"><span class="mk mk-${h.m.kind}">${KIND_LABEL[h.m.kind]}</span><span class="num">${markedNumber(h.s.number,h.m.mark)}</span><span>${simLine(h.s)}</span><button type="button" class="good" data-wact="yes" data-s="${esc(h.s.number)}">✔ This is it</button><button type="button" class="ghost" data-wact="no" data-s="${esc(h.s.number)}">✖ Not it</button></div>`).join('');

      const ms = w.status==='found' ? simOfWanted(w) : null;
      return `<div class="wrow ${w.status}" data-w="${w.id}">
        <div class="wmain">
          <div class="want-primary"><span class="num">${esc(w.number)}</span>${w.status==='open'?'<span class="badge p-want">Open</span>':w.status==='found'?'<span class="badge p-given">✔ Found</span>':'<span class="badge p-unknown">Closed</span>'}</div>
          <div class="wmeta"><b>${esc(w.name||'No name')}</b>${w.phone?' • 📞 '+esc(w.phone):''}${w.note?' • '+esc(w.note):''} • asked ${esc(fmtDate(w.createdAt))}</div>
          ${w.status==='found'?`<div class="wfound">→ ${esc([w.matchSid,w.matchPid].filter(Boolean).join(' • '))} <b class="num">${esc(w.matchNumber||'')}</b> • ${esc(KIND_LABEL[w.matchKind]||'Confirmed')} • ${esc(fmtDate(w.foundAt))}${ms?'':' (SIM no longer in list)'}</div>`:''}
          ${live}
        </div>
        <div class="wbtn">
          ${w.status==='open'?`<button type="button" class="ghost" data-wact="search">Search</button><button type="button" class="ghost" data-wact="edit">Edit</button><button type="button" class="ghost" data-wact="close">Close</button>`:''}
          ${w.status==='found'&&ms?`<button type="button" class="ghost" data-wact="show">Show SIM</button>`:''}
          ${w.status!=='open'?`<button type="button" class="ghost" data-wact="reopen">Re-open</button>`:''}
          <button type="button" class="danger" data-wact="del">Delete</button>
        </div>
      </div>`;
    }).join('') : `<div class="empty">${f==='open'?'Nothing to look for right now.':'Nothing here.'}</div>`;
  }

  function mergeWanted(arr){
    let n = 0;
    arr.forEach(x=>{
      const num = digits(x && x.number); if(num.length<4) return;
      const ex = wanted.find(w=>w.id===x.id);
      if(!ex){ wanted.push({id:x.id||uid(), number:num, name:x.name||'', phone:x.phone||'', note:x.note||'', createdAt:x.createdAt||new Date().toISOString(), status:['open','found','closed'].includes(x.status)?x.status:'open', ignored:Array.isArray(x.ignored)?x.ignored:[], matchSimId:x.matchSimId, matchNumber:x.matchNumber, matchSid:x.matchSid, matchPid:x.matchPid, matchKind:x.matchKind, foundAt:x.foundAt}); n++; }
      else if(ex.status==='open' && x.status && x.status!=='open'){ Object.assign(ex, {status:x.status, matchSimId:x.matchSimId, matchNumber:x.matchNumber, matchSid:x.matchSid, matchPid:x.matchPid, matchKind:x.matchKind, foundAt:x.foundAt}); n++; }
    });
    return n;
  }

  // নম্বর টাইপ করার সময়ই সতর্কতা: ডুপ্লিকেট / প্রায়-একই / Wanted-এর সাথে মিল
  function updateAddHint(){

    let html = '';

    if(dup) html += `<div class="ewarn" style="display:block;margin-top:8px">⚠ Already in your list: ${simLine(dup)}</div>`;
    else if(n.length >= 7){
      const sm = similarAll(n, new Set()).slice(0,3);
      if(sm.length) html += `<div class="ewarn" style="display:block;margin-top:8px">⚠ Looks like an existing number — typo? ${sm.map(x=>`<br><span class="num">${markedNumber(x.s.number,x.mark)}</span> ${simLine(x.s)}`).join('')}</div>`;
    }
    const wh = wanted.filter(w=>w.status==='open').map(w=>({w, m:wantMatch(w,{number:n,id:''})})).filter(x=>x.m).slice(0,3);
    if(wh.length) html += `<div class="wantnote">🔔 This matches your Wanted list: ${wh.map(x=>`<b>${esc(x.w.name||'No name')}</b> asked for <span class="num">${esc(x.w.number)}</span> (${KIND_LABEL[x.m.kind]})`).join('; ')}</div>`;

  const TKEY = 'simManagerTypoIgnore_v1';
  let typoIgnore = new Set(); try{ typoIgnore = new Set(JSON.parse(localStorage.getItem(TKEY)||'[]')); }catch(e){}
  const saveTypoIgnore = () => { try{ localStorage.setItem(TKEY, JSON.stringify([...typoIgnore])); }catch(e){} };
  const typoKey = (a,b) => [a.number,b.number].sort().join('|');
  let typoState = [];
  function scanTypos(){
    const out = [];
    for(let i=0;i<sims.length;i++) for(let j=i+1;j<sims.length;j++){
      const a=sims[i], b=sims[j], len=Math.max(a.number.length,b.number.length), md = len>=10 ? 2 : 1;
      if(Math.abs(a.number.length-b.number.length) > 1 || len<7 || histDiff(a.number,b.number) > 2*md) continue;
      if(typoIgnore.has(typoKey(a,b))) continue;
      const r = editInfo(a.number, b.number);
      if(r.d <= md) out.push({a, b, d:r.d, mA:editInfo(b.number,a.number).mark, mB:r.mark});
      if(out.length >= 200) return out;
    }
    return out.sort((x,y)=>x.d-y.d);
  }
  function drawTypos(){
    $('infoTitle').textContent = '🔍 Possible typos in your list';

      </div>`).join('') : '<div class="empty">No suspicious pairs found 👍</div>';
  }

      <div class="nbody">
        <div class="nserial"><small>SERIAL NO.</small><b>${esc(s.sid)}</b><span class="snum">${esc(s.number)}</span></div>
        <div class="nmsg">Write this number on the box where you keep this SIM.<br>It will make finding it later easy.</div>
        ${warn}
        ${ackBlock('I have noted this ID')}
      </div>`);
  }
  function showBulkNote(added, dups){
    const rows = list => list.filter(Boolean).map(x=>`<tr><td class="pid S" style="font-size:22px">${esc(x.sid)}</td><td class="num" style="font-size:15px">${esc(x.number)}</td></tr>`).join('');
    openNote('bulk', `
      <div class="nhead ${added.length?'':'warn'}" style="padding-bottom:0"><div class="ncheck">${added.length?'✓':'!'}</div><h3 id="noteTitle" style="margin-bottom:0">${added.length} SIM${added.length===1?'':'s'} saved${dups.length?` • ${dups.length} already existed`:''}</h3></div>
      <div class="nbody">
        ${added.length?`<div class="nlist"><table><thead><tr><th>Serial No.</th><th>Number</th></tr></thead><tbody>${rows(added)}</tbody></table></div>
        <div class="nmsg">Write each number on the box where you keep that SIM.</div>`:''}
        ${dups.length?`<div class="nsub">Already in your list (not added again):</div><div class="nlist"><table><tbody>${rows(dups)}</tbody></table></div>`:''}
        ${ackBlock(added.length?'I have noted these IDs':'OK, got it')}
      </div>`);
  }
  function showDup(ex){
    openNote('dup', `
      <div class="nhead warn"><div class="ncheck">!</div><h3 id="noteTitle">This number already exists</h3><p>Nothing was added. Here is the SIM that is already in your list:</p></div>
      <div class="nbody">
        <div class="dupcard">
          <div class="ids"><b style="color:#334155">${esc(ex.sid||'')}</b><b class="pid ${ex.pid?ex.pid[0]:''}" style="font-size:32px">${ex.pid?esc(ex.pid):'<span class="nopid" style="font-size:16px">no type ID</span>'}</b></div>
          <div class="num">${esc(ex.number)}</div>
          <div>${esc(PL[ex.purpose]||'Unknown')}${ex.name?' • '+esc(ex.name):' • <span class="nopid">no client name</span>'}${ex.home?' • '+esc(ex.home):''}</div>
          ${ex.note?`<div class="hint">Note: ${esc(ex.note)}</div>`:''}
          <div class="hint">Added ${esc(fmtDate(ex.createdAt))}${ex.given?' • ✔ Given '+esc(fmtDate(ex.givenAt)):' • In stock'}</div>
        </div>
        <div class="nbtns"><button type="button" data-nact="show">Show in list</button><button type="button" class="sec" data-nact="edit" data-n="${esc(ex.number)}">Edit this SIM</button><button type="button" class="sec" data-nact="close">Close</button></div>
      </div>`);
  }
  $('noteOv').addEventListener('click', e=>{
    const b = e.target.closest('button[data-nact]'); if(!b) return;
    const a = b.dataset.nact;
    if(a==='edit'){ const s = sims.find(x=>x.number===b.dataset.n); closeNote(); if(s) openEdit(s); }
    else if(a==='show'){ closeNote(); window.scrollTo({top:0, behavior:'smooth'}); }
    else closeNote();
  });
  document.addEventListener('keydown', e=>{
    if($('noteOv').hidden) return;
    if(e.key==='Escape'){ closeNote(); return; }
    if(e.key==='Enter'){ const ack = $('noteAck'); if(ack){ e.preventDefault(); confirmNote(); } }
  });

  // ---------- init ----------
  load(); loadWanted(); render(); renderWanted(); showBackupInfo();
  window.SIM_MANAGER_BRIDGE = {
    getData(){ return JSON.parse(JSON.stringify({sims, wanted, counters:meta.counters||{T:0,M:0,O:0,S:0}})); },
    showMessage(message,ms){ toast(message,ms||9000); },
    selectUserScope(uid){
      const scope = String(uid||'').replace(/[^a-zA-Z0-9_-]/g,'');
      if(!scope) throw new Error('Firebase user scope is missing');
      const next = {
        key: `simManagerData_v1_${scope}`,
        meta: `simManagerMeta_v1_${scope}`,
        wanted: `simManagerWanted_v1_${scope}`
      };
      // Move the old single-user browser cache only once, to the first signed-in UID.
      const hasScoped = localStorage.getItem(next.key)!==null || localStorage.getItem(next.meta)!==null || localStorage.getItem(next.wanted)!==null;
      if(!hasScoped){
        const legacy = {
          key: localStorage.getItem('simManagerData_v1'),
          meta: localStorage.getItem('simManagerMeta_v1'),
          wanted: localStorage.getItem('simManagerWanted_v1')
        };
        if(legacy.key!==null || legacy.meta!==null || legacy.wanted!==null){
          if(legacy.key!==null) localStorage.setItem(next.key,legacy.key);
          if(legacy.meta!==null) localStorage.setItem(next.meta,legacy.meta);
          if(legacy.wanted!==null) localStorage.setItem(next.wanted,legacy.wanted);
          localStorage.removeItem('simManagerData_v1');
          localStorage.removeItem('simManagerMeta_v1');
          localStorage.removeItem('simManagerWanted_v1');
        }
      }
      KEY=next.key; META=next.meta; WKEY=next.wanted;
      sims=[]; wanted=[]; meta={lastBackup:null,counters:{T:0,M:0,O:0,S:0}};
      load(); loadWanted(); render(); renderWanted(); showBackupInfo(); updateAddHint();
    },
    clearUserState(){
      sims=[]; wanted=[]; meta={lastBackup:null,counters:{T:0,M:0,O:0,S:0}};
      render(); renderWanted(); showBackupInfo(); updateAddHint();
    },
    applyRemote(data){
      sims = Array.isArray(data.sims) ? JSON.parse(JSON.stringify(data.sims)) : [];
      wanted = Array.isArray(data.wanted) ? JSON.parse(JSON.stringify(data.wanted)) : [];
      meta.counters = Object.assign({T:0,M:0,O:0,S:0}, data.counters||{});
      try{ localStorage.setItem(KEY, JSON.stringify(sims)); localStorage.setItem(WKEY, JSON.stringify(wanted)); localStorage.setItem(META, JSON.stringify(meta)); }catch(e){}
      render(); renderWanted(); showBackupInfo(); updateAddHint();
    }
  };
  $('fNum').focus();
})();
</script>

<script>
/* Motion + mobile-nav layer. Reads the DOM only; never touches saved data. */
(function(){
  const $=id=>document.getElementById(id);
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  // 1) tap pulse + light haptic
  document.addEventListener('pointerdown',e=>{
    const b=e.target.closest('button,.chip,.stat.click'); if(!b||b.disabled) return;
    const s=document.createElement('span'); s.className='tap'; s.style.left=e.clientX+'px'; s.style.top=e.clientY+'px';
    document.body.appendChild(s); setTimeout(()=>s.remove(),600);
    if(navigator.vibrate&&e.pointerType==='touch'){ try{navigator.vibrate(8)}catch(_){} }
  },{passive:true});
  // 2) stat counters roll to their new value
  const bs=[...document.querySelectorAll('.stat b')];
  const run=()=>bs.forEach(b=>{
    if(b._anim) return; const to=+b.textContent; if(isNaN(to)||to===b._v) return;
    const from=b._v||0; b._v=to;
    if(reduce||from===to){ return; }
    b._anim=1; b.classList.add('bump'); const t0=performance.now(), d=650;
    const step=t=>{ const k=Math.min(1,(t-t0)/d), e=1-Math.pow(1-k,3); b.textContent=Math.round(from+(to-from)*e);
      if(k<1) requestAnimationFrame(step); else { b.textContent=to; b._anim=0; b.classList.remove('bump'); } };
    requestAnimationFrame(step);
  });
  bs.forEach(b=>b._v=0); run();
  const mo=new MutationObserver(run); bs.forEach(b=>mo.observe(b,{childList:true,characterData:true,subtree:true}));
  // 3) table rows: staggered entrance on load, highlight for newly added rows
  const tb=$('tbody'), seen=new Set(); let first=true;
  const rows=()=>{ const rs=[...tb.querySelectorAll('tr[data-id]')]; let i=0;
    rs.forEach(r=>{ const id=r.dataset.id; if(seen.has(id)) return; seen.add(id);
      if(first){ if(i<14){ r.style.setProperty('--d',(i*35)+'ms'); r.classList.add('fx-in'); } i++; } else r.classList.add('fx-new'); });
    if(rs.length) first=false; };
  rows(); new MutationObserver(rows).observe(tb,{childList:true});
  // 4) panels pop in when they first appear
  ['idBanner','simPanel','wantPanel'].forEach(id=>{ const el=$(id); let had=false;
    new MutationObserver(()=>{ const has=!!el.firstElementChild; if(has&&!had) el.firstElementChild.classList.add('fx-pop'); had=has; }).observe(el,{childList:true}); });
  // 5) compact bottom navigation: Search / Wanted / SIM List / Backup.
  const items=[['⌕','Search','search'],['🔎','Wanted','wanted'],['▤','List','list'],['▣','Backup','backup']];
  const nav=document.createElement('nav'); nav.className='bnav'; nav.setAttribute('aria-label','Sections');
  nav.innerHTML=items.map((x,i)=>`<button type="button" class="${i===0?'on':''}" data-nav="${x[2]}"><span>${x[0]}</span>${x[1]}</button>`).join('');
  document.body.appendChild(nav);
  nav.addEventListener('click',e=>{ const b=e.target.closest('button[data-nav]'); if(!b)return;
    nav.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    const navApi=window.SIM_MANAGER_NAV;
    if(!navApi){ console.error('SIM_MANAGER_NAV is not ready'); return; }
    if(b.dataset.nav==='search') navApi.openSearch();
    else if(b.dataset.nav==='wanted') navApi.openWanted();
    else if(b.dataset.nav==='list') navApi.openList();
    else if(b.dataset.nav==='backup') navApi.openBackup();
  });
  const topTargets=[['searchCard','search'],['wantCard','wanted'],['listCard','list'],['backupCard','backup']];
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ const found=topTargets.find(([id])=>document.getElementById(id)===en.target); if(found) nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.nav===found[1])); } }),{rootMargin:'-35% 0px -55% 0px'});
    topTargets.forEach(([id])=>io.observe($(id)));
  }

})();
</script>

<script>
/* TV-LAYER: 11-digit rule + English/Bangla. Does not modify saved data or the backup/restore code. */
(function(){
  const $=id=>document.getElementById(id);
  let lang='en'; try{ if(localStorage.getItem('simManagerLang_v1')==='bn') lang='bn'; }catch(e){}
  const bn2en=s=>String(s||'').replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d));
  const dg=s=>bn2en(s).replace(/\D/g,'');
  // ---------- strict SIM number rule: exactly 11 digits, starts with 0 ----------
  function chk(n){
    const b=lang==='bn';
    if(n.length===11&&n[0]==='0') return '';
    if(n.length===13&&n.startsWith('880')) return b?'দেশের কোড 880 বাদ দিন; নম্বর ০ দিয়ে শুরু হয়ে ১১ ডিজিটের হতে হবে।':'Remove the country code 880 — the number must start with 0 and have 11 digits.';
    if(n.length<11) return b?`ডিজিট কম: ${n.length}টি। সিম নম্বর অবশ্যই ঠিক ১১ ডিজিটের হতে হবে।`:`Too short: ${n.length} digits. A SIM number must be exactly 11 digits.`;
    if(n.length>11) return b?`ডিজিট বেশি: ${n.length}টি। সিম নম্বর অবশ্যই ঠিক ১১ ডিজিটের হতে হবে।`:`Too long: ${n.length} digits. A SIM number must be exactly 11 digits.`;
    return b?'সিম নম্বর অবশ্যই ০ দিয়ে শুরু হতে হবে।':'A SIM number must start with 0.';

    if(!n){ hint.textContent=''; hint.className='numhint'; return; }
    hint.textContent=n.length+'/11'; hint.className='numhint '+(!chk(n)?'ok':(n.length>11||n[0]!=='0')?'bad':''); }
  fNum.addEventListener('input',upd);
  document.addEventListener('submit',e=>{
    const f=e.target;
    if(f.id==='addForm'){ const m=chk(dg(fNum.value)); if(m){ e.preventDefault(); e.stopImmediatePropagation();
      hint.textContent=m; hint.className='numhint bad'; fNum.classList.add('invalid'); fNum.classList.remove('shake'); void fNum.offsetWidth; fNum.classList.add('shake'); fNum.focus(); } }
    else if(f.id==='editForm'){ const n=dg($('eNum').value); if(n!==origNum){ const m=chk(n); if(m){ e.preventDefault(); e.stopImmediatePropagation(); $('eErr').textContent=m; } } }
  },true);

  const bulk=$('bulk'), be=document.createElement('div'); be.className='bulkerr'; bulk.insertAdjacentElement('afterend',be);
  bulk.addEventListener('input',()=>be.textContent='');
  document.addEventListener('click',e=>{
    if(!e.target.closest('#bulkBtn')) return;
    const parts=bn2en(bulk.value).split(/[\s,;]+/).map(dg).filter(Boolean), bad=parts.filter(p=>chk(p));
    if(!bad.length) return;
    e.preventDefault(); e.stopImmediatePropagation();
    const b=lang==='bn';
    be.textContent=(b?`${bad.length}টি নম্বর ১১ ডিজিটের সঠিক নম্বর নয় — কিছুই যোগ হয়নি। আগে ঠিক করুন:`:`${bad.length} number(s) are not valid 11-digit numbers — nothing was added. Fix these first:`)
      +' '+bad.slice(0,6).map(x=>`${x} (${x.length})`).join(', ')+(bad.length>6?' …':'');
    be.classList.remove('shake'); void be.offsetWidth; be.classList.add('shake');

  '🔔 Someone was looking for this SIM':'🔔 কেউ এই সিমটি খুঁজছিলেন','Exact match':'হুবহু মিল','Same last digits':'শেষের ডিজিট মিলেছে','Similar — possible typo':'কাছাকাছি — টাইপো হতে পারে','✔ Yes, this is it':'✔ হ্যাঁ, এটাই','✖ Not it':'✖ এটা না','✔ This is it':'✔ এটাই','🔎 In your Wanted list':'🔎 আপনার খোঁজা তালিকায়','⚠ Similar numbers — possible typo':'⚠ কাছাকাছি নম্বর — টাইপো হতে পারে','Open in Wanted':'খোঁজা তালিকায় খুলুন','Show SIM':'সিম দেখান','Re-open':'আবার খুলুন',
  'Backup downloaded':'ব্যাকআপ ডাউনলোড হয়েছে','Changes saved':'পরিবর্তন সংরক্ষিত','Number changed':'নম্বর বদলেছে','Invalid backup file':'ব্যাকআপ ফাইলটি সঠিক নয়','Auto-backup enabled':'অটো-ব্যাকআপ চালু হয়েছে','Deleted':'মুছে ফেলা হয়েছে','Enter a valid number':'সঠিক নম্বর দিন','No numbers found':'কোনো নম্বর পাওয়া যায়নি','Undo':'ফেরান','Enter at least 4 digits':'কমপক্ষে ৪ ডিজিট দিন','Wanted updated':'খোঁজা তালিকা আপডেট হয়েছে','Clear search and all filters':'সার্চ ও সব ফিল্টার মুছুন'};
  const P=[[/^Matching the last (\d+) digits$/,m=>'শেষের '+m[1]+' ডিজিট মিলিয়ে খোঁজা হচ্ছে'],[/^(.+) series · begins with (.+)$/,m=>m[1]+' সিরিজ · '+m[2]+' দিয়ে শুরু'],[/^Added — (.+)$/,m=>'যোগ হয়েছে — '+m[1]],[/^(\d+) added$/,m=>m[1]+'টি যোগ হয়েছে'],[/^(\d+) already existed$/,m=>m[1]+'টি আগে থেকেই ছিল'],
   [/^(\d+) results \(of (\d+)\)$/,m=>m[2]+'টির মধ্যে '+m[1]+'টি ফলাফল'],[/^(\d+) similar$/,m=>m[1]+'টি কাছাকাছি'],[/^(\d+) still looking$/,m=>m[1]+'টি খোঁজা চলছে'],[/^(\d+) found$/,m=>m[1]+'টি পাওয়া গেছে'],
   [/^(\d+)\/(\d+) digits match$/,m=>m[2]+' ডিজিটের '+m[1]+'টি মিলেছে'],[/^Last backup: (.+)$/,m=>'শেষ ব্যাকআপ: '+m[1]],[/^Deleted (.+)$/,m=>'মুছে ফেলা হয়েছে '+m[1]],[/^Restored (\S+)$/,m=>'ফিরিয়ে আনা হয়েছে '+m[1]],
   [/^Restored: (\d+) new, (\d+) updated/,m=>'রিস্টোর: '+m[1]+'টি নতুন, '+m[2]+'টি আপডেট'],[/^(.+) marked as GIVEN$/,m=>m[1]+' প্রদত্ত হিসেবে চিহ্নিত'],[/^(.+) back in stock$/,m=>m[1]+' আবার স্টকে'],
   [/^asked (.+)$/,m=>'অনুরোধ: '+m[1]],[/^(\d+) SIMs? saved$/,m=>m[1]+'টি সিম সংরক্ষিত'],[/^Delete (.+)\?$/s,m=>m[1]+' — মুছে ফেলবেন?'],[/^ID: (.+)$/,m=>'আইডি: '+m[1]],[/^🔎 Wanted$/,()=>'🔎 খোঁজা'],
   [/^Mark as given$/,()=>'প্রদত্ত হিসেবে চিহ্নিত করুন'],[/^Mark as NOT given$/,()=>'প্রদত্ত চিহ্ন তুলুন']];
  function tseg(s){ const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(s), c=m[2]; if(!c) return s; let r=D[c]; if(r!==undefined) return m[1]+r+m[3];
    for(const [re,fn] of P){ const x=re.exec(c); if(x) return m[1]+fn(x)+m[3]; } return s; }
  function tr(s){ if(!/[A-Za-z]/.test(s)) return s; let r=tseg(s); if(r!==s) return r;
    if(s.includes(' • ')){ let ch=false; const o=s.split(' • ').map(p=>{const q=tseg(p); if(q!==p) ch=true; return q;}); if(ch) return o.join(' • '); } return s; }
  const ATT=['placeholder','title','aria-label'];
  function doText(n){ if(n._bn===n.nodeValue) return; const t=tr(n.nodeValue); if(t!==n.nodeValue){ n._en=n.nodeValue; n._bn=t; n.nodeValue=t; } }
  function doAttr(el){ const a=el._a||(el._a={}); ATT.forEach(k=>{ const v=el.getAttribute(k); if(v==null) return; if(a[k]&&a[k][1]===v) return; const t=tr(v); if(t!==v){ a[k]=[v,t]; el.setAttribute(k,t); } }); }
  function walk(root){ if(lang!=='bn'||!root) return;
    if(root.nodeType===3){ if(root.parentElement&&!/^(SCRIPT|STYLE|TEXTAREA)$/.test(root.parentElement.tagName)) doText(root); return; }
    if(root.nodeType!==1) return;
    const w=document.createTreeWalker(root,4,{acceptNode:n=>{const p=n.parentElement; if(!p||/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.tagName)) return 2; const r=p.closest('tr[data-id]'); return (r&&!p.closest('td:nth-child(7)'))?2:1;}});
    const L=[]; let n; while((n=w.nextNode())) L.push(n); L.forEach(doText);
    if(!(root.closest&&root.closest('tr[data-id]'))||true){ if(root.matches&&root.matches('[placeholder],[title],[aria-label]')) doAttr(root); root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(doAttr); } }
  function toEn(){ const w=document.createTreeWalker(document.body,4); let n; while((n=w.nextNode())) if(n._en!==undefined&&n.nodeValue===n._bn){ n.nodeValue=n._en; n._bn=undefined; }
    document.querySelectorAll('*').forEach(el=>{ if(el._a){ for(const k in el._a) if(el.getAttribute(k)===el._a[k][1]) el.setAttribute(k,el._a[k][0]); el._a=null; } }); }
  new MutationObserver(ms=>{ if(lang!=='bn') return; ms.forEach(m=>{ if(m.type==='childList') m.addedNodes.forEach(walk); else if(m.type==='characterData') doText(m.target); else doAttr(m.target); }); })
    .observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:ATT});
  const oc=window.confirm; window.confirm=m=>oc.call(window,lang==='bn'?tr(String(m)):m);
  // switch UI
  const sw=document.createElement('div'); sw.className='lang'; sw.setAttribute('role','group'); sw.setAttribute('aria-label','Language');
  sw.innerHTML='<button type="button" data-l="en">EN</button><button type="button" data-l="bn">বাংলা</button>';
  document.querySelector('#langSlot').appendChild(sw);
  function setLang(l){ lang=l; try{localStorage.setItem('simManagerLang_v1',l);}catch(e){}
    document.documentElement.lang=l; document.body.classList.toggle('bn',l==='bn');
    sw.querySelectorAll('button').forEach(b=>{ b.classList.toggle('on',b.dataset.l===l); b.setAttribute('aria-pressed',b.dataset.l===l); });
    if(l==='bn') walk(document.body); else toEn();
    document.title=l==='bn'?D['TUSHAR VISA SIM Management System']:'TUSHAR VISA SIM Management System'; upd(); }
  sw.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b&&b.dataset.l!==lang) setLang(b.dataset.l); });
  setLang(lang);
})();
